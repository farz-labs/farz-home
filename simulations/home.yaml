room: "Living Room"

global_attributes:
  time_of_day: 14.5  # 14:30 in 24hr format
  weather: "sunny"
  outdoor_temperature: 18.0
  is_night: false
  season: "spring"

entities:
  - name: "Living Room Ceiling Light"
    tags: ["room:living", "device:light", "type:light"]
    attributes:
      state: "ON"
      brightness: 70
      heat: 0.0

  - name: "Living Room Thermostat"
    tags: ["room:living", "device:thermostat"]
    attributes:
      current_temperature: 22.1
      target_temperature: 22.5
      hvac_mode: "HEAT"
      humidity: 42

  - name: "Living Room Window Sensor"
    tags: ["room:living", "device:sensor", "type:contact"]
    attributes:
      state: "CLOSED"
      last_changed: "2023-10-27T07:55:00Z"

  - name: "Living Room Motion Sensor"
    tags: ["room:living", "device:sensor", "type:motion"]
    attributes:
      state: "DETECTED"
      lux_level: 180
      timeout_seconds: 60

  - name: "Living Room Smart Speaker"
    tags: ["room:living", "device:media_player", "type:media_player"]
    attributes:
      state: "PLAYING"
      volume: 25
      source: "Bluetooth"
      network_load_contribution: 0.0

  - name: "Living Room Laptop"
    tags: ["room:living", "device:computer", "type:laptop", "type:computer"]
    attributes:
      state: "ON"
      battery_level: 64
      is_charging: true
      cpu_usage_percent: 18
      heat_output: 0.0
      network_load_contribution: 0.0

  - name: "Living Room WiFi Router"
    tags: ["room:living", "device:router", "type:router", "network"]
    attributes:
      state: "ONLINE"
      ssid: "HomeSweetHome_5G"
      connected_devices_count: 3
      network_load: 25.0
      heat: 0.0
      current_download_mbps: 450
      current_upload_mbps: 28

  - name: "Living Room Smart TV"
    tags: ["room:living", "device:media_player", "type:media_player"]
    attributes:
      state: "OFF"
      volume: 15
      source: "HDMI1"
      heat: 0.0
      network_load_contribution: 0.0

physics:
  # Device-local heat generation
  - target_tag: "type:light"
    attribute: "heat"
    delta: 0.15
    condition: "state == \"ON\""

  - target_tag: "type:laptop"
    attribute: "heat_output"
    delta: 0.2
    condition: "state == \"ON\""

  - target_tag: "type:router"
    attribute: "heat"
    delta: 0.1
    condition: "network_load > 50"

  - target_tag: "type:media_player"
    attribute: "heat"
    delta: 0.12
    condition: "state == \"PLAYING\""

  # Network load contributions
  - target_tag: "type:laptop"
    attribute: "network_load_contribution"
    delta: 8.0
    condition: "state == \"ON\""

  - target_tag: "type:media_player"
    attribute: "network_load_contribution"
    delta: 15.0
    condition: "state == \"PLAYING\""

  # Natural decay
  - target_tag: "type:router"
    attribute: "network_load"
    delta: -2.0

  - target_tag: "type:laptop"
    attribute: "heat_output"
    delta: -0.1

  - target_tag: "type:light"
    attribute: "heat"
    delta: -0.05

  - target_tag: "type:media_player"
    attribute: "heat"
    delta: -0.08

  # Temperature dynamics
  - target_tag: "device:thermostat"
    attribute: "current_temperature"
    delta: 0.3
    condition: "hvac_mode == \"HEAT\" and current_temperature < target_temperature"

  - target_tag: "device:thermostat"
    attribute: "current_temperature"
    delta: -0.05

  # Battery drain
  - target_tag: "type:laptop"
    attribute: "battery_level"
    delta: -0.5
    condition: "state == \"ON\" and is_charging == False"

  # Global time progression (1 minute per tick)
  - target_tag: "global"
    attribute: "time_of_day"
    delta: 0.016

  # Weather affects indoor temperature
  - target_tag: "device:thermostat"
    attribute: "current_temperature"
    delta: -0.15
    condition: "g['outdoor_temperature'] < 15 and state == \"CLOSED\""

  # Thermostat works harder in cold weather
  - target_tag: "device:thermostat"
    attribute: "current_temperature"
    delta: 0.5
    condition: "hvac_mode == \"HEAT\" and current_temperature < target_temperature and g['outdoor_temperature'] < 10"
